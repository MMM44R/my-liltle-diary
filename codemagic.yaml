workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: |
          flutter create . --platforms=android --org com.mylittlediary
      - name: Force compileSdk 36 on ALL modules
        script: |
          echo "subprojects {" >> android/build.gradle.kts
          echo "    afterEvaluate {" >> android/build.gradle.kts
          echo "        if (project.plugins.hasPlugin(\"com.android.library\") || project.plugins.hasPlugin(\"com.android.application\")) {" >> android/build.gradle.kts
          echo "            project.extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let {" >> android/build.gradle.kts
          echo "                it.compileSdkVersion(36)" >> android/build.gradle.kts
          echo "            }" >> android/build.gradle.kts
          echo "        }" >> android/build.gradle.kts
          echo "    }" >> android/build.gradle.kts
          echo "}" >> android/build.gradle.kts
          echo "----- tail of android/build.gradle.kts -----"
          tail -n 20 android/build.gradle.kts
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
